<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f0f1a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Highlight Inner Border -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" />

  <!-- Modern Geometric 'A' (Aulad IT Solution) -->
  <path d="M32 13 L47.5 47 L39.5 47 L32 29.5 L24.5 47 L16.5 47 Z" fill="#ffffff" />
  
  <!-- Dynamic Crossbar -->
  <path d="M26 36 L38 36 L39.8 40 L24.2 40 Z" fill="#a5b4fc" />

  <!-- Glowing Core Node -->
  <circle cx="32" cy="46" r="3.5" fill="#38bdf8" />
  <circle cx="32" cy="46" r="1.5" fill="#ffffff" />
</svg>
